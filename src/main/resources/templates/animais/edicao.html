
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Animal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e8e8e8;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #7777e0;
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f7f7f7;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #7777e0;
            background-color: #fff;
        }

        span {
            display: block;
            color: #d00000;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #7777e0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background-color: #6262c5;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #7777e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Editar Animal</h1>

        <form th:action="@{/paginas/animais/editar}"
              th:object="${animal}" method="post">

            <input type="hidden" th:field="*{id}">

            <p>
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
                <span th:errors="*{nome}"></span>
            </p>

            <p>
                <label for="especie">Espécie</label>
                <select id="especie" th:field="*{especie}">
                    <option value="">Selecione</option>
                    <option th:each="e : ${especies}"
                            th:value="${e}"
                            th:text="${e}"></option>
                </select>
                <span th:errors="*{especie}"></span>
            </p>

            <p>
                <label for="porte">Porte</label>
                <select id="porte" th:field="*{porte}">
                    <option value="">Selecione</option>
                    <option th:each="p : ${portes}"
                            th:value="${p}"
                            th:text="${p}"></option>
                </select>
                <span th:errors="*{porte}"></span>
            </p>

            <p>
                <label for="tutor">Tutor</label>
                <select id="tutor" th:field="*{tutor.id}">
                    <option value="">Selecione</option>
                    <option th:each="t : ${tutores}"
                            th:value="${t.id}"
                            th:text="${t.nome}"></option>
                </select>
                <span th:errors="*{tutor}"></span>
            </p>

            <button type="submit">Salvar alterações</button>
        </form>

        <a th:href="@{/paginas/animais}">Voltar</a>
    </div>
</body>
</html>
